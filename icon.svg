<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1b1542"/>
      <stop offset="100%" stop-color="#0a0820"/>
    </radialGradient>
    <linearGradient id="saff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd75e"/>
      <stop offset="100%" stop-color="#ffb62e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- neon circuit curve (magenta outer + cyan inner) -->
  <path d="M 60 360 C 120 240, 220 200, 300 240 S 440 360, 460 180"
        fill="none" stroke="#ff5575" stroke-width="10" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 60 360 C 120 240, 220 200, 300 240 S 440 360, 460 180"
        fill="none" stroke="#46e6ff" stroke-width="4" stroke-linecap="round" opacity="0.7" transform="translate(0,18)"/>
  <!-- checkered start strip -->
  <g transform="translate(64,330)">
    <rect width="14" height="14" fill="#f0f0ff"/>
    <rect x="14" width="14" height="14" fill="#15102e"/>
    <rect y="14" width="14" height="14" fill="#15102e"/>
    <rect x="14" y="14" width="14" height="14" fill="#f0f0ff"/>
  </g>
  <!-- saffron neon car (top-down) -->
  <g filter="url(#glow)" transform="translate(256,250) rotate(-18)">
    <rect x="-34" y="-18" width="68" height="36" rx="6" fill="url(#saff)"/>
    <rect x="-22" y="-12" width="40" height="24" rx="4" fill="#0d0b20" opacity="0.55"/>
    <rect x="24" y="-4" width="8" height="8" fill="#ffffff"/>
    <!-- wheels -->
    <rect x="-26" y="-22" width="10" height="6" fill="#0d0b20"/>
    <rect x="16" y="-22" width="10" height="6" fill="#0d0b20"/>
    <rect x="-26" y="16" width="10" height="6" fill="#0d0b20"/>
    <rect x="16" y="16" width="10" height="6" fill="#0d0b20"/>
  </g>
  <!-- title accent dot -->
  <circle cx="256" cy="80" r="6" fill="#35e0c6" filter="url(#glow)"/>
</svg>
